name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build and unit tests — runs on every PR and push
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

  # Deploy serverless functions — only on push to main (not on PRs)
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: YC-health deploy
        uses: yc-actions/yc-sls-function@v4.1.0
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          yc-sa-id: ${{ secrets.YC_SA_ID }}
          bucket: ${{ secrets.BUCKET }}
          folder-id: ${{ secrets.FOLDER_ID }}
          function-name: 'goha-health'
          runtime: 'golang123'
          memory: '128Mb'
          execution-timeout: 1
          service-account: ${{ secrets.YC_SA_ID }}
          entrypoint: 'health.HealthHandler'
          source-root: '.'
          environment: |
            YDB_METADATA_CREDENTIALS=1
            YDB_CONNECTION_STRING=${{ secrets.YDB_CONNECTION }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          include: |
            ./**/*.go
            ./go.mod
            ./go.sum

      - name: Health-check
        run: |
          sleep 3s
          HEALTH_CHECK_PROD_URL=${{ secrets.HEALTH_CHECK_PROD_URL }} go test

      - name: TgBind deploy
        uses: yc-actions/yc-sls-function@v4.1.0
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          yc-sa-id: ${{ secrets.YC_SA_ID }}
          bucket: ${{ secrets.BUCKET }}
          folder-id: ${{ secrets.FOLDER_ID }}
          function-name: 'goha-tgbind'
          runtime: 'golang123'
          memory: '128Mb'
          execution-timeout: 1
          service-account: ${{ secrets.YC_SA_ID }}
          entrypoint: 'player_bindings.TgBindHandler'
          source-root: '.'
          environment: |
            YDB_METADATA_CREDENTIALS=1
            YDB_CONNECTION_STRING=${{ secrets.YDB_CONNECTION }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          include: |
            ./**/*.go
            ./go.mod
            ./go.sum

      - name: Chats Deploy
        uses: yc-actions/yc-sls-function@v4.1.0
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          yc-sa-id: ${{ secrets.YC_SA_ID }}
          bucket: ${{ secrets.BUCKET }}
          folder-id: ${{ secrets.FOLDER_ID }}
          function-name: 'goha-chats'
          runtime: 'golang123'
          memory: '128Mb'
          execution-timeout: 1
          service-account: ${{ secrets.YC_SA_ID }}
          entrypoint: 'chats_handler.ChatsHandler'
          source-root: '.'
          environment: |
            YDB_METADATA_CREDENTIALS=1
            YDB_CONNECTION_STRING=${{ secrets.YDB_CONNECTION }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          include: |
            ./**/*.go
            ./go.mod
            ./go.sum

      - name: Messages Deploy
        uses: yc-actions/yc-sls-function@v4.1.0
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          yc-sa-id: ${{ secrets.YC_SA_ID }}
          bucket: ${{ secrets.BUCKET }}
          folder-id: ${{ secrets.FOLDER_ID }}
          function-name: 'goha-messages'
          runtime: 'golang123'
          memory: '128Mb'
          execution-timeout: 1
          service-account: ${{ secrets.YC_SA_ID }}
          entrypoint: 'messages_handler.MessagesHandler'
          source-root: '.'
          environment: |
            YDB_METADATA_CREDENTIALS=1
            YDB_CONNECTION_STRING=${{ secrets.YDB_CONNECTION }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          include: |
            ./**/*.go
            ./go.mod
            ./go.sum

      - name: Tasks Producer Deploy
        uses: yc-actions/yc-sls-function@v4.1.0
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          yc-sa-id: ${{ secrets.YC_SA_ID }}
          bucket: ${{ secrets.BUCKET }}
          folder-id: ${{ secrets.FOLDER_ID }}
          function-name: 'goha-tasks-producer'
          runtime: 'golang123'
          memory: '128Mb'
          execution-timeout: 1
          service-account: ${{ secrets.YC_SA_ID }}
          entrypoint: 'tasks_handler.TasksProduceHandler'
          source-root: '.'
          environment: |
            YDB_METADATA_CREDENTIALS=1
            YDB_CONNECTION_STRING=${{ secrets.YDB_CONNECTION }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          include: |
            ./**/*.go
            ./go.mod
            ./go.sum

      - name: YC-queue-handler deploy
        uses: yc-actions/yc-sls-function@v4.1.0
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          yc-sa-id: ${{ secrets.YC_SA_ID }}
          bucket: ${{ secrets.BUCKET }}
          folder-id: ${{ secrets.FOLDER_ID }}
          function-name: 'goha'
          runtime: 'golang123'
          memory: '512Mb'
          execution-timeout: 30
          service-account: ${{ secrets.YC_SA_ID }}
          entrypoint: 'index.QueueHandler'
          source-root: '.'
          environment: |
            YDB_METADATA_CREDENTIALS=1
            YDB_CONNECTION_STRING=${{ secrets.YDB_CONNECTION }}
          include: |
            ./**/*.go
            ./go.mod
            ./go.sum

      - name: YC-webhook deploy
        uses: yc-actions/yc-sls-function@v4.1.0
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          yc-sa-id: ${{ secrets.YC_SA_ID }}
          bucket: ${{ secrets.BUCKET }}
          folder-id: ${{ secrets.FOLDER_ID }}
          function-name: 'goha-webhook'
          runtime: 'golang123'
          memory: '256Mb'
          execution-timeout: 10
          service-account: ${{ secrets.YC_SA_ID }}
          entrypoint: 'tg_handler.WebhookHandler'
          source-root: '.'
          environment: |
            YDB_METADATA_CREDENTIALS=1
            YDB_CONNECTION_STRING=${{ secrets.YDB_CONNECTION }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          include: |
            ./**/*.go
            ./go.mod
            ./go.sum
